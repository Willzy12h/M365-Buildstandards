name: Publish validated Preview.18

# Manual promotion of the original tested Preview.18 artifact. Kept out of build.yml so a dispatch no longer creates
# skipped build/standard/secrets check runs on the head commit, which GitHub counts as satisfying required checks
# (CLA-20261006-09). The job never rebuilds, merges branches or overwrites a published release.
#
# The `release` environment is the approval gate. Until the repository owner adds required reviewers to it under
# Settings -> Environments, GitHub creates it unprotected and the gate is documentary only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-preview18:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    concurrency:
      group: publish-preview18
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Verify the pinned successful source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/Publish-ValidatedPreview.py --check-run
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: 37515288607
          name: portable-windows-review
          path: release-input/portable
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: 37515288607
          name: synthetic-ui-review
          path: release-input/ui
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          github-token: ${{ github.token }}
          run-id: 37515288607
          name: standard-definition-exports
          path: release-input/standards
      - name: Verify original bytes, upload assets and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 build/Publish-ValidatedPreview.py
